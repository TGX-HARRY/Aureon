<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="./images/Logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
</head>
<body>
    <script>
        const sessionData = localStorage.getItem("sessionData");
        const userID = sessionData ? JSON.parse(sessionData).id : null;
        if (!userID) {
            window.location.href = "/login.html";
        }

        async function getData() {
            const response = await fetch(`/api/subscribers/${userID}`);
            if (!response.ok) {
                const errorData = await response.json() || "Data couldn't be fetched at this moment, please try again later!";
                alert(errorData.message || errorData);
                return;
            }

            const data = await response.json();
            return {
                name: data.fetchedData.name,
                email: data.fetchedData.email
            };
        }
        document.addEventListener("DOMContentLoaded", async () => {
                try {
                    const userData = await getData();
                    
                    const submitButton = document.getElementById("submitButton");
                    if (!userData) return;

                    const username = document.getElementById("uname");
                    const email = document.getElementById("email");

                    if (username) username.value = userData.name || "";
                    if (email) email.value = userData.email || "";

                } catch (error) {
                    console.error("Error loading user data:", error);
                }
            });
    </script>
    <body>
        <form>
            <label for="uname">Username: </label>
            <input type="text" id="uname" value="" placeholder="username">

            <label for="email">Email: </label>
            <input type="email" id="email" value="" disabled>
        </form>
    </body>
</body>
</html>
