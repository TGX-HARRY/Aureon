<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="CSS/profile.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
</head>
<body>
<script>

    const sessionData = localStorage.getItem("sessionData");
    const userID = sessionData ? JSON.parse(sessionData).id : null;

    if (!userID) {
        window.location.href = "./login.html";
    }

    async function getData() {
    const response = await fetch(`/api/users/subscribers/${userID}`);

    console.log("Response status:", response.status);

    if (!response.ok) {
        console.log("Failed to fetch user data");
        return null;
    }

    const data = await response.json();
    console.log("API data:", data);

    const user = data.fetchedData;
    return user;
}

    document.addEventListener("DOMContentLoaded", async () => {

    const userData = await getData();
    if (!userData) return;

    document.getElementById("uname").value = userData.name || "";
    document.getElementById("email").value = userData.email || "";
    document.getElementById("fullname").value = userData.fullName || "";
    document.getElementById("phone").value = userData.phone || "";
    document.getElementById("address").value = userData.address || "";
    document.getElementById("dob").value = userData.dob || "";

    if (userData.gender) {
        const genderSelect = document.getElementById("gender");
        for (let i = 0; i < genderSelect.options.length; i++) {
            if (genderSelect.options[i].text === userData.gender) {
                genderSelect.selectedIndex = i;
                break;
            }
        }
    }

    /* ⭐ Avatar loading logic */

    const avatarPreview = document.getElementById("avatarPreview");
    const avatarHidden = document.getElementById("avatarUrl");
    const avatars = document.querySelectorAll(".avatar-option");

    const userAvatar = userData.avatar || "./images/avatar1.jpg";

    avatarPreview.src = userAvatar;
    avatarHidden.value = userAvatar;

    avatars.forEach(a => {
        if (a.getAttribute("src") === userAvatar) {
            a.classList.add("selected");
        } else {
            a.classList.remove("selected");
        }
    });

});

    // Only numbers in phone
   document.addEventListener("DOMContentLoaded", () => {
    // Avatar selection
let selectedAvatar = "images/avatar1.png";

const avatars = document.querySelectorAll(".avatar-option");
const preview = document.getElementById("avatarPreview");
const slider = document.getElementById("avatarSlider");

avatars.forEach(avatar => {

    avatar.addEventListener("click", () => {

        avatars.forEach(a => a.classList.remove("selected"));

        avatar.classList.add("selected");

        selectedAvatar = avatar.getAttribute("src");

        preview.src = selectedAvatar;

        document.getElementById("avatarUrl").value = selectedAvatar;

    });

});

// Slider buttons
document.getElementById("rightBtn").addEventListener("click", () => {
    slider.scrollBy({ left: 120, behavior: "smooth" });
});

document.getElementById("leftBtn").addEventListener("click", () => {
    slider.scrollBy({ left: -120, behavior: "smooth" });
});

    const phone = document.getElementById("phone");
    phone.addEventListener("input", function () {
        this.value = this.value.replace(/[^0-9]/g, '');
    });

    const form = document.querySelector("form");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const updatedData = {
            id: userID,
            name: document.getElementById("uname").value,
            avatar: document.getElementById("avatarUrl").value,
            fullName: document.getElementById("fullname").value,
            email: document.getElementById("email").value,
            phone: document.getElementById("phone").value,
            gender: document.getElementById("gender").value,
            address: document.getElementById("address").value,
            dob: document.getElementById("dob").value
        };

        try {
            const response = await fetch(`/api/users/subscribers/changeinfo`, {
                method: "PATCH",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(updatedData)
            });

            const result = await response.json();
            alert("Profile updated successfully!");
            window.location.href = "./index.html";

        } catch (error) {
            console.error(error);
        }
    });

});
</script>

<div class="container">
    <div class="form-card">
        <h1>Edit Profile</h1>
        <form>
           <!-- Avatar Selection -->
            <div class="avatar-section">

                <div class="avatar-preview">
                    <img id="avatarPreview" src="./images/avatar1.jpg">
                </div>

                <div class="avatar-carousel">

                    <button type="button" class="avatar-btn" id="leftBtn">&#10094;</button>

                    <div class="avatar-slider" id="avatarSlider">
                        <img src="./images/avatar1.jpg" class="avatar-option selected">
                        <img src="./images/avatar2.jpg" class="avatar-option">
                        <img src="./images/avatar3.jpg" class="avatar-option">
                        <img src="./images/avatar4.jpg" class="avatar-option">
                    </div>

                    <button type="button" class="avatar-btn" id="rightBtn">&#10095;</button>

                </div>

                <input type="hidden" id="avatarUrl" value="./images/avatar1.jpg">

            </div>
            <!-- Full Name --> 
             <div class="input-group"> <input type="text" id="fullname" placeholder=" " required>
                <label>Full Name</label>
            </div>
            <!-- Username -->
            <div class="input-group">
                <input type="text" id="uname" placeholder=" " required>
                <label>Username</label>
            </div>
            <!-- Email -->
            <div class="input-group">
                <input type="email" id="email" placeholder=" " disabled required>
                <label>Email</label>
            </div>
            <!-- Phone -->
            <div class="input-group">
                <input type="tel" id="phone" placeholder=" " maxlength="10" required>
                <label>Phone Number</label>
            </div>
            <!-- Address -->
            <div class="input-group">
                <input type="text" id="address" placeholder=" " required>
                <label>Address</label>
            </div>
            <!-- Date of Birth -->
            <div class="input-group">
                <input type="date" id="dob" required>
                <label class="fixed-label">Date of Birth</label>
            </div>
            <!-- Gender -->
            <div class="input-group">
                <select id="gender" required>
                    <option value="" disabled selected></option>
                    <option>Female</option>
                    <option>Male</option>
                    <option>Others</option>
                </select>
                <label class="fixed-label">Gender</label>
            </div>

            <!-- Buttons -->
            <div class="btn-group">
                <button type="button" class="btn cancel" onclick="window.history.back()">Cancel</button>
                <button type="submit" id="submitButton" class="btn save">Save Changes</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
