<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login - Aureon</title>
    <link rel="icon" href="./images/Logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./CSS/login.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="logo">Aureon</div>
        <ul class="nav-links">
            <li><a href="./about.html">About</a></li>
            <!-- <li><a href="./contact.html">Contact</a></li> -->
        </ul>
    </nav>

    <!-- Login Section -->
    <div class="login-container">
        <div class="login-box">

            <h1 class="login-title">Sign In</h1>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email or Username</label>
                    <input id="email" type="text" placeholder="Enter your email or username" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" type="password" placeholder="Enter your password" required autocomplete="current-password">
                </div>

                <button type="submit" class="login-btn">Sign In</button>

            </form>
        <div id="error-message" class="error-message"></div>
            <div class="signup-link">
                New to Aureon? <a href="./signup.html">Sign up now</a>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>© 2026 Aureon. Crafted with passion.</p>
        <div class="footer-links">
            <a href="./about.html">About</a>
            <a href="./contact.html">Contact</a>
            <a href="/">Home</a>
        </div>
    </footer>
    <script src = "./JS/login.js"></script>
</body>

</html>
