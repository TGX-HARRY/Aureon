<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login - Aureon</title>
    <link rel="icon" href="./images/Logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./CSS/login.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        .google-btn-container {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="logo">Aureon</div>
        <ul class="nav-links">
            <li><a href="./about.html">About</a></li>
            <!-- <li><a href="./contact.html">Contact</a></li> -->
        </ul>
    </nav>

    <!-- Login Section -->
    <div class="login-container">
        <div class="login-box">

            <h1 class="login-title">Sign In</h1>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email or Username</label>
                    <input id="email" type="text" placeholder="Enter your email or username" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" type="password" placeholder="Enter your password" required autocomplete="current-password">
                </div>

                <button type="submit" class="login-btn">Sign In</button>

                <div class="google-btn-container">
                    <div id="g_id_onload"
                        data-client_id="270879117388-n34sv9rn6uhcg6bbu1nc6b4q8if5jvq6.apps.googleusercontent.com"
                        data-callback="handleCredentialResponse"
                        data-auto_prompt="false">
                    </div>
                    <div class="g_id_signin"
                        data-type="standard"
                        data-size="large"
                        data-theme="outline"
                        data-text="sign_in_with"
                        data-shape="rectangular"
                        data-logo_alignment="left">
                    </div>
                </div>

            </form>
        <div id="error-message" class="error-message"></div>
            <div class="signup-link">
                New to Aureon? <a href="./signup.html">Sign up now</a>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>© 2026 Aureon. Crafted with passion.</p>
        <div class="footer-links">
            <a href="./about.html">About</a>
            <a href="./contact.html">Contact</a>
            <a href="/">Home</a>
        </div>
    </footer>
    <script src = "./JS/login.js"></script>
</body>

</html>
