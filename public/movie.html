<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./images/Logo.png">
    <title>Watch - Aureon</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="./CSS/movie.css">
</head>
<body class="watch-page">
    <div id="dynamicBg" class="dynamic-bg"></div>
    
    <nav class="watch-nav">
        <a href="./index.html" class="back-link">
            <i class="fa fa-chevron-left"></i> Back to Home
        </a>
        <div class="logo">Aureon</div>
    </nav>

    <main class="watch-container">
        <div class="player-wrapper">
            <div class="player-container">
                <iframe id="trailerFrame" frameborder="0" allow="autoplay; fullscreen" allowfullscreen></iframe>
            </div>
        </div>

        <div class="movie-content">
            <div class="movie-header">
                <h1 id="movieTitle">Loading...</h1>
                <div class="movie-meta">
                    <span id="movieRating" class="rating-tag"><i class="fa fa-star"></i> --</span>
                    <span id="movieGenre" class="genre-tag">--</span>
                </div>
            </div>
            
            <div class="movie-details-card">
                <h3>Overview</h3>
                <p id="movieOverview">Loading movie details...</p>
                
                <div class="action-buttons">
                    <button class="btn-main"><i class="fa fa-plus"></i> Add to My List</button>
                    <button class="btn-sec"><i class="fa fa-share-alt"></i> Share</button>
                </div>
            </div>
        </div>
    </main>

    <script src="./JS/Movie.js"></script>
</body>
</html>
