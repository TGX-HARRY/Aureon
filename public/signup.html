<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Aureon</title>
  <link rel="stylesheet" href="CSS/signup.css">
  <link rel="icon" href="./images/Logo.png">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">Aureon</div>
    <ul class="nav-links">
      <li><a href="./about.html">About</a></li>
      <li><a href="./contact.html">Contact</a></li>
    </ul>
  </nav>

  <!-- Signup Form -->
  <div class="signup-container">
    <div class="signup-box">
      <h1 class="signup-title">Sign Up</h1>

      <form id="signUpForm" method="post">
        <div class="form-group">
          <label for="name">Username</label>
          <input type="text" name="name" id="name" placeholder="Enter your name" required autocomplete="name">
          <small class="error-msg" id="nameError"></small>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" name="email" id="email" placeholder="Enter your email" required autocomplete="email">
          <small class="error-msg" id="emailError"></small>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" name="password" id="password" placeholder="Create a password" required
            autocomplete="new-password">
          <small class="error-msg" id="passwordError"></small>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" name="confirmPassword" id="confirmPassword" placeholder="Confirm your password"
            required autocomplete="new-password">
          <small class="error-msg" id="confirmError"></small>
        </div>

        <button class="signup-btn" type="submit" id="subButton">Create Account</button>

        <div class="auth-divider">
          <span>or continue with</span>
        </div>

        <div id="g_id_onload" data-client_id="270879117388-n34sv9rn6uhcg6bbu1nc6b4q8if5jvq6.apps.googleusercontent.com"
          data-callback="handleCredentialResponse" data-auto_prompt="false">
        </div>

        <button type="button" class="google-btn" onclick="triggerGoogleSignIn()">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="22px" height="22px">
            <path fill="#FFC107"
              d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z" />
            <path fill="#FF3D00"
              d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z" />
            <path fill="#4CAF50"
              d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z" />
            <path fill="#1976D2"
              d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z" />
          </svg>
          Sign up with Google
        </button>

      </form>

      <div class="login-link">
        <p>Already have an account? <a href="./login.html">Sign In</a></p>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2025 Aureon. Made by passionate developers!</p>
    <a href="./about.html">About</a>
    <a href="./contact.html">Contact</a>
    <a href="/">Home</a>
  </footer>

  <script src="./JS/signup.js"></script>
</body>

</html>
