<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Aureon</title>
  <link rel="stylesheet" href="CSS/signup.css">
  <link rel="icon" href="./images/Logo.png">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">Aureon</div>
    <ul class="nav-links">
      <li><a href="./about.html">About</a></li>
      <li><a href="./contact.html">Contact</a></li>
    </ul>
  </nav>

  <!-- Signup Form -->
  <div class="signup-container">
    <div class="signup-box">
      <h1 class="signup-title">Sign Up</h1>

      <form id="signUpForm" method="post">
        <div class="form-group">
          <label for="name">Username</label>
          <input type="text" name="name" id="name" placeholder="Enter your name" required autocomplete="name">
          <small class="error-msg" id="nameError"></small>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" name="email" id="email" placeholder="Enter your email" required autocomplete="email">
          <small class="error-msg" id="emailError"></small>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" name="password" id="password" placeholder="Create a password" required
            autocomplete="new-password">
          <small class="error-msg" id="passwordError"></small>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" name="confirmPassword" id="confirmPassword" placeholder="Confirm your password"
            required autocomplete="new-password">
          <small class="error-msg" id="confirmError"></small>
        </div>

        <button class="signup-btn" type="submit" id="subButton">Create Account</button>

        <div class="auth-divider">
          <span>or continue with</span>
        </div>

        <!-- Google renders its button here -->
        <div id="google-signin-btn" class="google-btn-wrapper"></div>

      </form>

      <div class="login-link">
        <p>Already have an account? <a href="./login.html">Sign In</a></p>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2025 Aureon. Made by passionate developers!</p>
    <a href="./about.html">About</a>
    <a href="./contact.html">Contact</a>
    <a href="/">Home</a>
  </footer>

  <script src="./JS/signup.js"></script>
  <script>
      window.addEventListener("load", function () {
          google.accounts.id.initialize({
              client_id: "270879117388-n34sv9rn6uhcg6bbu1nc6b4q8if5jvq6.apps.googleusercontent.com",
              callback: handleCredentialResponse
          });
          google.accounts.id.renderButton(
              document.getElementById("google-signin-btn"),
              { theme: "outline", size: "large", width: 350, text: "signup_with" }
          );
      });
  </script>
</body>

</html>
