<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Aureon</title>
  <link rel="stylesheet" href="CSS/signup.css">
  <link rel="icon" href="./images/Logo.png">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">Aureon</div>
    <ul class="nav-links">
      <li><a href="./about.html">About</a></li>
      <li><a href="./contact.html">Contact</a></li>
    </ul>
  </nav>

  <!-- Signup Form -->
  <div class="signup-container">
    <div class="signup-box">
      <h1 class="signup-title">Sign Up</h1>

      <form id="signUpForm" method="post">
          <div class="form-group">
            <label for="name">Username</label>
            <input type="text" name="name" id="name" placeholder="Enter your name" required autocomplete="name">
            <small class="error-msg" id="nameError"></small>
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" name="email" id="email" placeholder="Enter your email" required autocomplete="email">
            <small class="error-msg" id="emailError"></small>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" placeholder="Create a password" required autocomplete="new-password">
            <small class="error-msg" id="passwordError"></small>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" name="confirmPassword" id="confirmPassword" placeholder="Confirm your password" required autocomplete="new-password">
            <small class="error-msg" id="confirmError"></small>
          </div>

          <button class="signup-btn" type="submit" id="subButton">Create Account</button>
      </form>

      <div class="login-link">
        <p>Already have an account? <a href="./login.html">Sign In</a></p>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2025 Aureon. Made by passionate developers!</p>
    <a href="./about.html">About</a>
    <a href="./contact.html">Contact</a>
    <a href="/">Home</a>
  </footer>
  
  <script src="./JS/signup.js"></script>
</body>
</html>
